[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "post-at"
version = "0.1.0"
description = "Unofficial client for the Österreichische Post (post.at) app API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Christoph Ritzer" }]
keywords = ["post.at", "österreichische post", "austrian post", "parcel", "tracking", "shipment", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "pydantic>=2.11"]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/ch-rit/post_at_lib"
Source = "https://github.com/ch-rit/post_at_lib"
Issues = "https://github.com/ch-rit/post_at_lib/issues"
Changelog = "https://github.com/ch-rit/post_at_lib/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/post_at"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "__pycache__",
    "*.pyc",
    "/research",
    "/captures",
    "*.apkm",
    ".post_session.json",
]
